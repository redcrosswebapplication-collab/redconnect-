name: redcross_connect
description: RedCross Connect+ - donate blood, book appointments, request blood and get your membership card.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  image_picker: ^1.1.2
  google_fonts: ^6.2.1
  intl: '>=0.19.0 <1.0.0'
  supabase_flutter: ^2.18.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
